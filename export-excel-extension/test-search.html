        .search-box { 
            background: white; padding: 16px; border-radius: 6px; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 16px;
        }

            width: 100%; max-width: 400px; padding: 10px 14px;
            border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        .search-box input:focus { outline: none; border-color: #1565c0; }

        .table-wrapper { background: white; border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.1); overflow: hidden; }

        table { border-collapse: collapse; width: 100%; font-size: 13px; }
        thead tr { background: #1565c0; }
        th {
            color: white; font-weight: 600; padding: 10px 12px;
            text-align: center; border: 1px solid #1976d2;
            white-space: nowrap;
        }
        td {

            color: #222; vertical-align: top;
        }
        tbody tr:nth-child(even) td { background: #fafafa; }
        tbody tr:hover td { background: #e3f2fd; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: #555; }
        .pagination { display: flex; gap: 4px; align-items: center; }
        .pagination button {
            min-width: 32px; height: 32px; padding: 0 10px;
            border: 1px solid #1565c0; background: white; color: #1565c0;
            border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;
        }
        .pagination button.active { background: #1565c0; color: white; }
        .pagination button:disabled { opacity: 0.35; cursor: default; border-color: #ccc; color: #999; }
    </style>
</head>

const PAGE_SIZE = 8;
let currentPage = 1;
let filteredData = [...allData];

function applySearch() {
    const query = document.getElementById("searchInput").value.toLowerCase().trim();
    if (!query) {
        filteredData = [...allData];
    } else {
        filteredData = allData.filter(row => 
            row.some(cell => cell.toLowerCase().includes(query))
        );
    }
    currentPage = 1;
    renderTable();
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    
    const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
    const start = (currentPage - 1) * PAGE_SIZE;
    const slice = filteredData.slice(start, start + PAGE_SIZE);
    
    slice.forEach((row, i) => {
        const tr = document.createElement("tr");
        const stt = start + i + 1;
        tr.innerHTML = `<td>${stt}</td>` + row.map(c => `<td>${c}</td>`).join("");
        tbody.appendChild(tr);
    });
    
    document.getElementById("pageInfo").textContent = 
        `Trang ${currentPage} / ${totalPages || 1} — Tổng số bản ghi: ${filteredData.length}`;
    
    updatePagination(totalPages);
}

function updatePagination(totalPages) {
    document.getElementById("btnFirst").disabled = currentPage === 1;
    document.getElementById("btnPrev").disabled = currentPage === 1;
    document.getElementById("btnNext").disabled = currentPage >= totalPages;
    document.getElementById("btnLast").disabled = currentPage >= totalPages;
    
    // Render page numbers dynamically
    const pageNumbers = document.getElementById("pageNumbers");
    pageNumbers.innerHTML = "";
    const maxVisible = 5;
    let start = Math.max(1, currentPage - 2);
    let end = Math.min(totalPages, start + maxVisible - 1);
    if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);
    
    for (let p = start; p <= end; p++) {
        const btn = document.createElement("button");
        btn.textContent = p;
        btn.className = p === currentPage ? "active" : "";
        btn.addEventListener("click", () => { currentPage = p; renderTable(); });
        pageNumbers.appendChild(btn);
    }
}

document.getElementById("searchInput").addEventListener("input", applySearch);
document.getElementById("btnFirst").addEventListener("click", () => { currentPage = 1; renderTable(); });
document.getElementById("btnPrev").addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderTable(); } });
document.getElementById("btnNext").addEventListener("click", () => { 
    const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
    if (currentPage < totalPages) { currentPage++; renderTable(); }
});
document.getElementById("btnLast").addEventListener("click", () => { 
    currentPage = Math.ceil(filteredData.length / PAGE_SIZE);
    renderTable();
});

renderTable();
